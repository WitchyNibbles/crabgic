name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format

  typecheck:
    name: typecheck (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: tsc -b (cold)
        run: npm run typecheck
      - name: tsc -b (incremental, no-op expected)
        run: npm run typecheck

  test:
    name: unit-test+coverage (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # FULL HISTORY, and this is load-bearing rather than defensive.
          #
          # `scripts/check-marketplace-pin-digest.test.mjs` classifies five REAL
          # historical commits by `git archive`-ing each one's `packages/plugin`
          # and running the production classifier over it. That corpus is the
          # RED-first evidence for the check — the drift it pins actually
          # happened, twice, and is recoverable only from history.
          #
          # `actions/checkout`'s default is a depth-1 shallow clone, under which
          # every one of those commits is `fatal: not a valid object name`.
          # Measured on PR #131: 7 failed on BOTH `ubuntu-latest` and
          # `ubuntu-24.04-arm` while the same suite was green locally, because a
          # developer's clone has the history and the runner's did not.
          #
          # The alternative — skipping those assertions when history is absent —
          # is refused on the same grounds as the bubblewrap guard below: a
          # suite that early-returns on a missing prerequisite reports a green
          # tick having asserted nothing. The suite instead asserts the history
          # IS present, so a future checkout change fails here with a message
          # naming this setting rather than cascading into seven confusing
          # assertion failures.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      # Roast round 23, finding 4: the ONLY test that executes the real
      # confinement argv against a real sandbox early-returns when `bwrap` is
      # absent, so on a runner without bubblewrap it reported a green tick
      # having asserted nothing. `release-e2e.yml` and `engine-live.yml` both
      # install bubblewrap explicitly, which is what makes it clear the runner
      # image does not carry it — so the round-18 defect class (`echo RAN` ->
      # `echo RUN` survived 5260 tests) was guarded here by nothing at all.
      - name: install bubblewrap (the sandbox self-test needs a real one)
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      # Roast round 24: `bwrap --version` was the wrong guard. It asserts
      # PRESENCE while the test needs working CONFINEMENT, and the two differ
      # exactly where it matters — Ubuntu 24.04's
      # `apparmor_restrict_unprivileged_userns`, containers, hardened kernels.
      # bwrap would install, `--version` would exit 0, the require-flag would be
      # set, and the test would fail with `expected false to be true` on a
      # required every-push job, throwing away the check's own finding which
      # names the exact sysctl. So the real confinement argv decides, and the
      # flag is only set when the sandbox demonstrably works.
      - name: require a WORKING sandbox only where one can exist
        run: |
          # Roast round 26: the target must be a path this account CREATED and
          # owns, or the refusal proves nothing about the sandbox. Writing to
          # /tmp/<name> relies on /tmp being 1777 by convention; on a runner
          # where it is not, ordinary permissions would deny the write and the
          # guard would certify a sandbox it never tested. That is exactly the
          # round-20 defect the product's own check was rewritten to avoid.
          marker="$(mktemp -d)/marker"
          : > "$marker"
          if bwrap --ro-bind / / --unshare-all --die-with-parent -- \
               sh -c 'echo x > "$1"' eo-ci-probe "$marker" 2>/dev/null; then
            echo "bwrap ran but the read-only bind did not deny the write" >&2
            exit 1
          fi
          rm -rf "$(dirname "$marker")"
          if bwrap --ro-bind / / --unshare-all --die-with-parent -- true 2>/dev/null; then
            echo "confinement verified — the sandbox self-test must not skip"
            echo "CRABGIC_REQUIRE_BWRAP=1" >> "$GITHUB_ENV"
          else
            echo "::warning::bwrap cannot create a namespace on this runner;" \
                 "the sandbox self-test will skip rather than fail"
          fi
      - name: test with 80% line+branch coverage gate
        run: npm test

      # roadmap/23 Exit criteria: "ARM64 build+test verified on real
      # hardware/CI, or an explicitly documented substitute recorded —
      # closes 01's deferred ARM64 gate."
      #
      # This matrix leg IS that verification: `ubuntu-24.04-arm` is a real
      # aarch64 runner, and the build+test above just ran natively on it.
      # What was missing until now is the BINDING — nothing tied a green
      # ARM64 leg to a specific object ID, so `e2e/attestation`'s
      # arm64-verification check had no run record to read and the release
      # gate scored the item FAIL.
      #
      # `uname -m` is recorded rather than assumed: the record must prove
      # the leg genuinely ran on aarch64 hardware, not merely that a job
      # named "arm" was scheduled. The step is skipped on the x86-64 leg.
      #
      # `conclusion` IS OBSERVED, NOT ASSERTED. This step used to be
      # `if: success()` and write the literal `"conclusion": "success"`.
      # That was technically true (the record only existed for a green leg)
      # and useless: the field carried no information, and the consumer's
      # "did not conclude success" branch in
      # `e2e/attestation/src/arm64Verification.ts` was dead code that could
      # never fire. It is now `if: always()` + `${{ job.status }}`, so the
      # recorded conclusion is an OBSERVED value rather than a literal, and
      # a red or cancelled ARM64 leg produces a record that SAYS SO.
      #
      # DO NOT READ THAT AS "and the gate then reports the red leg". It does
      # not, on the only wired path. `release-e2e.yml`'s ingest step selects
      # ci.yml runs with `status=success`, which is the WHOLE RUN's
      # conclusion: a failing `ubuntu-24.04-arm` leg fails the `test` job
      # (`fail-fast: false` does not change the job's conclusion), the run
      # is excluded from the query, and the red leg's record is never
      # downloaded. Through CI the gate therefore reports "no ARM64 CI run
      # record was found for this candidate", NOT 'concluded "failure"'.
      # The consumer's non-success branch is defence in depth: it fires only
      # on a record hand-archived at `ARM64_RUN_RECORD_PATH` for post-hoc
      # audit. `e2e/attestation/src/arm64Verification.test.ts` reads this
      # heredoc out of this file and validates it against
      # `Arm64RunRecordSchema`, so producer and consumer cannot drift.
      - name: record ARM64 build+test evidence
        if: always() && matrix.os == 'ubuntu-24.04-arm'
        run: |
          mkdir -p arm64-evidence
          cat > arm64-evidence/arm64-run-record.json <<EOF
          {
            "workflow": "ci",
            "jobName": "unit-test+coverage (${{ matrix.os }})",
            "runId": "${{ github.run_id }}",
            "runAttempt": "${{ github.run_attempt }}",
            "commitSha": "${{ github.sha }}",
            "arch": "$(uname -m)",
            "kernel": "$(uname -sr)",
            "nodeVersion": "$(node --version)",
            "conclusion": "${{ job.status }}",
            "capturedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat arm64-evidence/arm64-run-record.json
      - name: upload ARM64 run record
        if: always() && matrix.os == 'ubuntu-24.04-arm'
        uses: actions/upload-artifact@v4
        with:
          name: arm64-run-record
          path: arm64-evidence/arm64-run-record.json
          if-no-files-found: error

  commitlint:
    name: commitlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: lint PR commits
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
      - name: lint the subject a squash merge will write
        # The range step above lints the BRANCH commits. A squash merge keeps
        # none of them: GitHub writes one commit whose subject is this PR's
        # title with ` (#<number>)` appended. That subject is linted by
        # nothing before the merge button -- and on 2026-08-19 it put a
        # 108-character header on `main` (commit cf67bd2) from a 100-character
        # title that had passed the step above. `main` cannot be made green
        # again without rewriting published history, so the subject is checked
        # here, while the title can still be edited.
        #
        # PR_TITLE arrives via `env:` and NOT via `${{ }}` inside `run:`: a
        # title is attacker-controlled text, and direct interpolation is
        # substituted before the shell parses the line.
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: printf '%s (#%s)\n' "$PR_TITLE" "$PR_NUMBER" | npx commitlint --verbose
      - name: lint pushed commit
        if: github.event_name == 'push'
        run: npx commitlint --from ${{ github.event.before }} --to ${{ github.sha }} --verbose

  engine-pin-lint:
    name: engine-pin-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: engine-pin-lint (fails on any ^/~/range specifier for the pinned engine dependency)
        run: npm run check:engine-pin

  meta-checks:
    name: meta-checks (workspace-count, package-graph, repo-hygiene, release-notes, criteria-closeout)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, for the criteria-baseline re-derivation below: it
          # reads each phase file at the revision that phase's baseline was
          # frozen at, and those revisions are older than a shallow clone.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: workspace enumeration returns exactly 18
        run: npm run check:workspace-count
      # A member of `check:all` that ran nowhere in CI until 2026-08-18. The
      # roadmap phase graph — not package acyclicity — is the binding
      # constraint on where code may live (ledger Gap 21), so a cycle here is
      # not caught by any type error or failing test; it is caught by nothing
      # at all. Reads package.json manifests only, so it belongs in this job:
      # dependency-free, and this job does not build.
      - name: the 18-package dependency graph is a DAG
        run: npm run check:package-graph
      - name: repo-hygiene (required top-level files present, non-empty)
        run: npm run check:hygiene
      - name: release-notes-prep records the npm-name verdict
        run: npm run check:release-notes
      # The committed marketplace entry couples three facts — `version`,
      # `commit` and `digest` — but only the digest was kept fresh per push
      # (`packages/plugin/src/marketplace-schema.test.ts`'s freshness
      # assertion). `version` and `commit` move only at a release cut, so
      # between cuts the entry describes HEAD's plugin content while naming the
      # previous release's commit. Measured on five real commits: that state
      # held for the whole of the 1.5.0 -> 1.6.0 interval, twice, and NOTHING
      # per-push said a word about it — the only check that looks at the pin at
      # all (`e2e/release`'s `marketplacePinCheck`) is not a `vitest.config.ts`
      # project and runs in no per-push channel, so the drift surfaced once per
      # release. This step names the two legal states, PASSES both, prints the
      # drift on every push when the entry is ahead of its own pin, and blocks
      # only on the third case (a digest describing no tree, a pin that
      # resolves to nothing, or a pin HEAD cannot reach). Needs the full
      # history the `fetch-depth: 0` above already provides: it `git archive`s
      # the pinned commit to recompute that tree's digest. Dependency-free and
      # build-free, like its siblings here.
      - name: marketplace entry is in one of its two legal digest states
        run: npm run check:marketplace-pin
      # The release gate refuses a cut once the committed vendor-support-window
      # record is more than 30 days old, or once a vendor's window has closed.
      # That check (`e2e/attestation`'s `checkVersionSupportWindows`) has no
      # production caller and runs in NO per-push channel — its only invocation
      # is inside a suite that runs solely under
      # `npm run test:e2e:release-evidence`, which `publish.yml` blocks on at a
      # `v*` tag. So the first anyone would learn of an expired bound is inside
      # a tag-triggered publish, which is the most expensive moment to learn it.
      #
      # This step warns 21 days ahead, naming the exact date each target turns
      # the gate red.
      #
      # ⚖️ THE TWO ARMS ARE ENFORCED IN DIFFERENT PLACES, by owner ruling
      # 2026-08-07, and the split is the whole reason this is safe to make a
      # required check. A STALE PROBE STAMP only WARNS here: the risk it names
      # is "we would be shipping on evidence nobody re-checked", which is a
      # release-time risk, and it still FAILS at a cut inside
      # `checkVersionSupportWindows`. An ACTUALLY-EXPIRED VENDOR WINDOW FAILS
      # here too, because pinning an out-of-support version is a fact about the
      # repository today rather than about releasing. Without that split this
      # step would have turned EVERY pull request red from the 31st day until a
      # human ran the probe — an escalation from "cannot cut a release" to
      # "cannot merge anything", for work with no connection to releasing.
      #
      # It also carries the auto-renewal tripwire, which is the durable half. A
      # 30-day evidence bound is worth something only while refreshing it is a
      # deliberate, reviewable act. `drift-ci.yml` runs the probe weekly and
      # uploads the rewritten record as an ARTIFACT while the release gate reads
      # the COMMITTED file — and until now nothing pinned that distinction. One
      # `git commit` step in that workflow would have made the bound renew
      # itself, silently and forever. This step fails if any workflow both runs
      # the probe and can commit or push its output.
      - name: vendor-support-window bound is fresh, and cannot renew itself
        run: npm run check:support-windows
      # The criteria-closeout index (`docs/evidence/criteria-closeout/
      # phase-NN.json`) is where each roadmap phase's ticked exit criteria
      # record their citations. Validated here so a record cannot drift from
      # the phase file it describes: it requires exactly one `## Exit criteria`
      # section per phase file (located fence-aware — a decoy section made every
      # other check below read the wrong criteria entirely), re-hashes every criterion's
      # verbatim text and requires that text to account for the WHOLE checkbox
      # item (prefix match, with the remainder constrained to the `— **`
      # citation annotation — a bare prefix match would let a record pin a
      # harmless opening substring, and a bare em-dash lead would let it stop
      # at the criterion's OWN internal em dash, either way leaving a softened
      # tail invisible), cross-checks tick state and checkbox count in both
      # directions, holds every criterion against the frozen original-wording
      # baseline, resolves every `test`/`artifact` citation to a real
      # non-symlink file inside the repo at a line that exists, and requires
      # each UNMET's defect record to be a real defect record. A criterion
      # quietly reworded to make it tickable, a stale `file:line`, or a defect
      # record truncated to nothing all fail this step. Runs on `npm ci` alone:
      # the validator is dependency-free precisely because this job does not
      # build.
      - name: criteria-closeout index matches its roadmap phase files
        run: npm run check:criteria-closeout
      # The baseline is the only anchor that lives outside the commit under
      # review, so it must not be forgeable by editing one more file in the
      # same PR. This step re-derives every frozen hash straight from
      # `git show <pinned-rev>:roadmap/NN-*.md`, which makes laundering it a
      # matter of rewriting published history rather than editing JSON.
      - name: criteria baseline re-derives from git history
        run: npm run check:criteria-baseline
      # The offline validator can only check that a `ci-run` citation NAMES a
      # run in this repository. This step makes the run have to EXIST: a
      # reviewer built a wholly forged phase closeout whose every baseline hash
      # matched and whose every citation was `job 00000000000` / `runs/1`, and
      # CI went green. Only a definitive 404 fails here — "could not ask the
      # API" warns and passes, so a GitHub blip cannot red an honest PR.
      - name: cited CI runs actually exist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run check:citation-runs
      # Both validators above are blind to what a citation SAYS. One reads the
      # record JSON's shape and resolves `ref` to a file at a line that exists;
      # the other checks a run URL. Neither reads a single quoted character, so
      # the moment a later PR inserts lines above cited text the merged record
      # keeps validating while pointing at the wrong place — measured at 182
      # citations of 1292, 154 of them under ticked criteria, caused by at least
      # five separate merged PRs including the one whose own pass filed the
      # defect record asking for this step. This step content-resolves every quoted
      # fragment against the tree and compares the result to a committed
      # baseline, so it fails on the PR that moves the ground under a citation
      # rather than years later. Legacy drift is seeded into that baseline as
      # known, so this starts at zero noise; new and edited citations are held
      # to resolving exactly where they claim. It also fails any `path:NN` in
      # roadmap or defect prose that names a missing file or a line past its
      # end. Dependency-free, like its two siblings: this job does not build.
      - name: cited file content resolves at the lines the records claim
        run: npm run check:citation-content

  # The two members of `check:all` that measure the PUBLISHABLE ARTIFACT rather
  # than the source tree. Both were absent from this workflow until 2026-08-18,
  # and their absence was not a gap in coverage — it was a gap in MEANING.
  #
  # `check:install-smoke` reads whatever `packages/cli/dist` happens to hold, and
  # that is uncommitted build output. On one working tree in one session it
  # returned three different verdicts: FAIL mid-edit, PASS after `npm run build`,
  # FAIL after `tsc -b` alone — because `tsc -b` leaves per-file output that
  # genuinely imports `@crabgic/*`, while the bundling that removes those imports
  # is the ROOT `npm run build`. Each verdict was correct about different bytes.
  # Its verdict was then quoted in the bodies of merged PRs #144 and #145 as a
  # fact about `main`, and it was not one.
  # See `docs/evidence/criteria-closeout/defects/25-install-smoke-depends-on-local-dist-state.md`.
  #
  # A clean checkout plus a full `npm run build` is the only state in which
  # either check makes a claim about the repository, which is exactly what this
  # job is: a separate job rather than steps on `test`, because `test` is a
  # two-OS matrix and packing the tarball twice measures nothing twice.
  packaging:
    name: packaging (publishable tarball installs from a clean checkout)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      # `npm run build`, NOT `tsc -b`. The check's own comment used to blame a
      # `packages/cli` `prepack` for the bundling; that script does not exist and
      # never did. Bundling is `tsc -b && bundle:types && bundle:cli`, and only
      # the full build produces the artifact these two checks can judge.
      - run: npm run build
      - name: the published tarball carries the entry points and no tests
        run: npm run check:tarball
      - name: the packed tarball installs into a clean project and its bins run
        run: npm run check:install-smoke
