name: release-e2e

# roadmap/23-release-hardening.md work item 1 / §Interfaces produced:
# "`e2e/release-gate-report.json` (introduced here; phase-23-internal) —
# the checklist-item -> EvidenceRecord audit trail, archived by the
# `release-e2e` CI job (introduced here)." Exit criteria: "`release-e2e` CI
# job's archived `e2e/release-gate-report.json` shows PASS for every item
# below, each linked to >=1 EvidenceRecord from the exact release-candidate
# object ID."
#
# HONESTY NOTE (mirrors `engine-live.yml`/`jira-datacenter-smoke.yml`'s own
# precedent). Work items 2-10's six self-contained harnesses
# (`e2e/provisioning`, `e2e/matrix/{installation,git,orchestration,connector}`,
# `e2e/live`, `e2e/release`) plus `e2e/attestation` exist, and this job runs
# their OFFLINE (non-`@live`/non-`CRABGIC_LIVE`-gated) suites and typechecks them
# via `npm run check:e2e-types`, immediately before generating the report.
# "OFFLINE" means "not `@live`/`CRABGIC_LIVE`-gated", NOT "makes no network
# calls": `e2e/release` issues one read-only `npm view` per composed-gate
# run (fail-closed — see `e2e/release/vitest.config.ts`), and this job
# additionally sets `CRABGIC_RELEASE_REBUILD_CHECKOUTS=1` below, which runs a
# real `npm ci` + `npm run build` per exported checkout. Neither publishes,
# tags, nor mutates anything.
#
# WHAT CHANGED (2026-07-25) — THE SHARED JOURNAL IS NOW WIRED. This note
# used to say that each harness's `EvidenceRecord` journal was a per-test
# ephemeral temp directory the generator could never read, so "every one of
# the 15 checklist items legitimately still scores EVIDENCE-PENDING". That
# was accurate about the wiring and fatal in effect: the harness step ran
# `npm run test:e2e` with no `CRABGIC_RELEASE_GATE_JOURNAL_DIR`, so every harness
# wrote into an `mkdtemp` directory it then deleted on cleanup, while
# `e2e/report`'s generator read `DEFAULT_JOURNAL_DIR` under `$TMPDIR`. A
# report generated by THIS JOB therefore linked ZERO EvidenceRecords for
# EVERY item, no matter how green the suites were.
#
# It is now wired, and it takes both halves:
#   1. `CRABGIC_RELEASE_GATE_JOURNAL_DIR` is set once at JOB level, so the
#      harness step and the generator step observe the same directory (see
#      the shared-journal branch in each harness's own `testJournal.ts`,
#      where `cleanup()` becomes a deliberate no-op).
#   2. The harness step runs `npm run test:e2e:release-evidence`, the
#      `--no-file-parallelism` variant. Concurrent test files appending to
#      one journal is exactly what that script exists to prevent.
# `CRABGIC_RELEASE_CANDIDATE_OBJECT_ID` is resolved ONCE, below, and passed to
# both steps: the generator only links evidence whose `objectId` equals the
# release candidate, and the workflow input is an EMPTY STRING when omitted
# (`inputs.release_candidate_object_id` renders as ""), which is not
# `undefined` and so defeated the generator's own `??` fallback.
#
# Trigger stays manual (`workflow_dispatch`) and this job is NOT part of
# the required push/PR check set (unlike `ci.yml`/`gates-conformance.yml`/
# `perf-conformance.yml`, which run on every push) — mirrors `engine-live`'s
# own "live runs are started deliberately" rationale, and additionally: a
# release-gate report is a statement about a specific release candidate,
# not a per-push signal.

# CALLABLE AS WELL AS DISPATCHABLE (2026-07-30).
#
# `workflow_dispatch` alone meant the gate only ever ran when somebody
# remembered to ask for it, and between 2026-07-27 and 2026-07-30 nobody did:
# v1.1.2, v1.2.0, v1.3.0 and v1.4.0 all shipped while the only PASS on record
# was scored against the v1.0.0 candidate. A gate whose whole value is that it
# reports honestly cannot be the one artifact nobody re-checks, so `publish.yml`
# now calls this workflow on the tagged commit and refuses to publish unless it
# passes. The generator already exits non-zero on an overall-FAIL verdict, which
# is what makes it usable as a gate rather than a report.
#
# `workflow_call` mirrors the dispatch inputs exactly, except that `scoring_mode`
# is a plain string: `type: choice` is dispatch-only, and a called workflow that
# declares it is rejected outright.
on:
  workflow_dispatch:
    inputs:
      release_candidate_object_id:
        description: "Exact release-candidate Git object ID (defaults to `git rev-parse HEAD` of the checked-out ref if omitted)"
        required: false
        type: string
      scoring_mode:
        description: "'interim' (missing evidence -> EVIDENCE-PENDING) or 'final' (missing evidence -> FAIL, the real release-cut mode)"
        required: false
        type: choice
        options:
          - interim
          - final
        default: interim
  workflow_call:
    inputs:
      release_candidate_object_id:
        description: "Exact release-candidate Git object ID (defaults to `git rev-parse HEAD` of the checked-out ref if omitted)"
        required: false
        type: string
      scoring_mode:
        description: "'interim' or 'final'. A publish gate always passes 'final'."
        required: false
        type: string
        default: interim

# `actions: read` is required by the ARM64 ingest step below: downloading an
# artifact produced by a DIFFERENT workflow run (`ci.yml`) goes through the
# Actions API, which the default `contents`-only token cannot read. Nothing
# here needs write of any kind — this job publishes nothing and mutates
# nothing.
permissions:
  contents: read
  actions: read

jobs:
  release-e2e:
    name: release-e2e (ReleaseGateReport generator)
    runs-on: ubuntu-latest
    # Raised from 30 when the reproducible-build rebuild leg was wired in
    # below: `CRABGIC_RELEASE_REBUILD_CHECKOUTS=1` makes `e2e/release` populate
    # its two clean checkouts with two REAL `npm ci` + `npm run build`
    # runs, sequentially, on top of everything this job already did.
    # Measured on a warm local npm cache: ~7.5s `npm ci` + ~14.0s `tsc -b`
    # per checkout (~46s for the leg); a cold CI cache is far slower.
    timeout-minutes: 60
    steps:
      # THE one journal both the harnesses and the generator read/write.
      # Deliberately under `$RUNNER_TEMP` rather than `$GITHUB_WORKSPACE`:
      # several harnesses assert against the checked-out tree, and an
      # untracked journal directory inside it would be a foreign object in
      # the release candidate they are attesting to.
      #
      # Exported HERE rather than in a job-level `env:` because the `runner`
      # context is NOT available in `jobs.<id>.env` — only `github`, `needs`,
      # `strategy`, `matrix`, `vars`, `inputs` and `secrets` are. Referencing
      # `${{ runner.temp }}` there does not fail the step, it makes the whole
      # workflow file INVALID: GitHub then creates a run named after the raw
      # file path, with zero jobs and a `failure` conclusion, which is exactly
      # what happened on the first push of this file. `$GITHUB_ENV` makes the
      # value visible to every subsequent step in the job, which is the
      # behaviour the job-level block was reaching for.
      - name: Export the shared release-gate journal directory
        run: echo "CRABGIC_RELEASE_GATE_JOURNAL_DIR=$RUNNER_TEMP/release-gate-journal" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      # HOST CAPABILITIES THE OFFLINE LEG GENUINELY ASSERTS.
      #
      # Two tests in `e2e/live` are host-conformance checks that are NOT
      # `@live`/CRABGIC_LIVE-gated, because they need no auth and no network — only
      # a real binary on the host:
      #   - `versionRangeGate.test.ts` shells out to the real `claude --version`
      #     and requires the verdict to be `in-range`/`out-of-range`, never
      #     `probe-failed`.
      #   - `sandboxSelftestHarness.test.ts` runs the real `bwrap` confinement
      #     self-test and requires `passed === true`.
      # `docs/engine-baseline.md` §6 records both as present on the baseline
      # host. A stock GitHub runner has neither, so the first-ever CI run of
      # this chain failed on exactly those two of 63 tests. Provisioning them
      # here is what makes the runner equivalent to the documented baseline —
      # the alternative, gating the tests off, would silently stop evidencing
      # version-range and sandbox conformance.
      - name: Provision the sandbox toolchain the confinement self-test needs
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat
          bwrap --version
          # Ubuntu 23.10+ (this runner is 24.04) ships an AppArmor policy that
          # forbids UNPRIVILEGED user namespaces, which is precisely what bwrap
          # needs. Installing bubblewrap is therefore NOT enough: `bwrap
          # --unshare-all` fails during SETUP, before the inner write is ever
          # attempted. `packages/cli/src/doctor/checks/sandbox-selftest.ts`
          # detects that case on purpose — an adversarial-review fix from
          # 2026-07-24 — and refuses to report it as "write correctly denied",
          # so it surfaces as an honest `passed: false` rather than a false
          # PASS. Relax the knob where it exists.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          # Prove confinement can actually be established, here, rather than
          # assuming the sysctl was sufficient. Without this the workflow would
          # go green on provisioning and fail 90 seconds later inside the
          # harness, reporting the symptom instead of the cause.
          bwrap --unshare-all --ro-bind / / /bin/true
          echo "bwrap can create an unprivileged namespace on this runner"
      # Pinned to TESTED_ENGINE_VERSION (`packages/engine-claude/src/version-gate.ts`),
      # NOT to the top of the accepted range. 2.1.218 is the version the full
      # phase-00 spike suite actually reproduced every PASS at, and it is the
      # CLI half of the 1:1 pair with the SDK's own pinned 0.3.218 — so both
      # transports report the same engine here, closing the "transport caveat"
      # `docs/engine-baseline.md` flags as load-bearing when PATH and SDK
      # disagree. `releaseWorkflowWiring.test.ts` binds this literal to that
      # constant so the two cannot drift apart silently.
      - name: Provision the pinned Claude Code CLI the version-range gate probes
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.218
          claude --version
      - name: Build (incl. e2e/report, wired into the root tsc -b project references)
        run: npm run build
      - name: Typecheck every self-contained e2e harness (each has its own tsconfig.json)
        run: npm run check:e2e-types
      - name: Resolve the release-candidate object ID once, for every step below
        id: release-candidate
        env:
          REQUESTED: ${{ inputs.release_candidate_object_id }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED" ]; then
            OBJECT_ID="$(git rev-parse --verify "${REQUESTED}^{commit}")"
          else
            OBJECT_ID="$(git rev-parse HEAD)"
          fi
          echo "object_id=$OBJECT_ID" >> "$GITHUB_OUTPUT"
          echo "release candidate: $OBJECT_ID"
      - name: Ingest the ARM64 run record ci.yml produced for that exact object ID
        # THE CONSUMER SIDE OF THE ARM64 LOOP. `ci.yml`'s `ubuntu-24.04-arm`
        # matrix leg uploads an `arm64-run-record` artifact; until now
        # NOTHING in this repository downloaded it, and
        # `e2e/attestation/src/arm64Verification.ts` looked for it at an
        # in-repo path no producer ever wrote. The item could not pass by
        # any route.
        #
        # WHY `$CRABGIC_ARM64_RUN_RECORD` AND NOT A COMMITTED FILE: the check
        # requires `record.commitSha == <release candidate>`. Committing a
        # downloaded record would advance HEAD past the object ID that
        # record names, so the two conditions could never hold at once. The
        # record is written to `$RUNNER_TEMP` — outside the checkout, never
        # staged — and handed over by env var.
        #
        # WHY `event=push`: on `pull_request`, `github.sha` is a synthetic
        # merge commit that exists in no checkout, so a PR-triggered record
        # names a commit nobody is cutting. Selecting push-triggered runs by
        # `head_sha` is what makes the equality a real binding rather than a
        # coincidence.
        #
        # WHAT `status=success` COSTS, STATED PLAINLY: it is a filter on the
        # WHOLE ci.yml RUN's conclusion, not on the ARM64 leg's. A red
        # `ubuntu-24.04-arm` leg (or a red lint/typecheck/commitlint/
        # meta-checks job in the same run) makes the run non-success, so its
        # `arm64-run-record` is never downloaded even though ci.yml's
        # `if: always()` step did write one saying `"conclusion": "failure"`.
        # Through this path the gate therefore reports "no ARM64 CI run
        # record was found", never 'concluded "failure"'. The consumer's
        # non-success branch is defence in depth for a record hand-archived
        # at `ARM64_RUN_RECORD_PATH`. Keeping the filter is deliberate:
        # ingesting a record from a run that did not fully pass would be
        # ingesting a partial result as verification.
        #
        # This step NEVER fails the job. A missing/unfetchable record is not
        # an infrastructure error to paper over — it is the honest input
        # "no ARM64 run has been verified for this candidate", and the gate
        # reports exactly that, with reasons.
        env:
          GH_TOKEN: ${{ github.token }}
          OBJECT_ID: ${{ steps.release-candidate.outputs.object_id }}
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/arm64-evidence"
          mkdir -p "$DEST"
          QUERY="head_sha=$OBJECT_ID&event=push&status=success&per_page=1"
          if ! RUN_ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?$QUERY" --jq '.workflow_runs[0].id // empty')"; then
            echo "::warning::could not query ci.yml runs for $OBJECT_ID"
            RUN_ID=""
          fi
          if [ -z "$RUN_ID" ]; then
            echo "::warning::no successful push-triggered ci.yml run for $OBJECT_ID -- arm64-verification will FAIL for want of a run record"
            exit 0
          fi
          if ! gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n arm64-run-record -D "$DEST"; then
            echo "::warning::ci.yml run $RUN_ID published no downloadable arm64-run-record artifact"
            exit 0
          fi
          RECORD="$(find "$DEST" -name arm64-run-record.json -print -quit)"
          if [ -z "$RECORD" ]; then
            echo "::warning::the arm64-run-record artifact of ci.yml run $RUN_ID contained no arm64-run-record.json"
            exit 0
          fi
          cat "$RECORD"
          echo "CRABGIC_ARM64_RUN_RECORD=$RECORD" >> "$GITHUB_ENV"
      - name: Re-run 15's performance matrix on this candidate (roadmap/23:75)
        # THE PRODUCER SIDE OF THE 23:75 OBLIGATION.
        #
        # `e2e/attestation/src/performanceContracts.ts` has always read
        # `perf-contract-rerun.json` and blocked while it is absent, and
        # NOTHING in this repository ever wrote one. `perf-conformance.yml`
        # runs 15's matrix on every push but archives no record and the
        # release gate never sees it, so `performance-contracts` failed for
        # want of an artifact no code path could produce — the ARM64
        # consumer-without-producer shape, inverted.
        #
        # The entry point is not invented here: `roadmap/15:112` names
        # `perf-conformance` as "the exact entry point 23 re-runs", and
        # `roadmap/23:26` asks for those matrices "executed on the frozen
        # release-candidate object ID". This step runs exactly that, on this
        # checkout, and records what 15's `decide()` engine returned.
        #
        # `$RUNNER_TEMP` for the same Gap 16 reason as the ARM64 record: the
        # record names the object ID it was taken against, and committing it
        # would advance HEAD past that ID.
        #
        # NEVER FAILS THE JOB (`|| true` is deliberate, and the CLI's own
        # exit status is the production verdict, not the release verdict). A
        # refusal — red matrix, or a runner too busy to measure on — is an
        # input the gate already reports as "no 15 re-run evidence"; killing
        # the job here would take every other item's evidence down with it.
        env:
          CRABGIC_RELEASE_CANDIDATE_OBJECT_ID: ${{ steps.release-candidate.outputs.object_id }}
          CRABGIC_PERF_CONTRACT_RERUN_RECORD: ${{ runner.temp }}/perf-contract-rerun.json
        run: |
          set -uo pipefail
          if npm run probe:perf-contract-rerun; then
            echo "CRABGIC_PERF_CONTRACT_RERUN_RECORD=$CRABGIC_PERF_CONTRACT_RERUN_RECORD" >> "$GITHUB_ENV"
          else
            echo "::warning::15's re-run produced no record -- performance-contracts will report the 23:75 obligation as unevidenced"
          fi
      - name: Bind the requirement-traceability artifact against a containerized Grafana
        # THE PRODUCER SIDE OF THE TRACEABILITY LOOP, and the reason
        # `requirement-traceability` could not previously clear.
        #
        # The artifact records the release-candidate object ID it was
        # captured against, and the check requires that to equal the
        # candidate being scored. Committing a regenerated artifact ADVANCES
        # HEAD past the object ID it names, so the two conditions could never
        # hold at once — the same catch-22 the ARM64 record has, and which
        # `docs/interface-ledger.md`'s Gap 16 solves with an `CRABGIC_*` override
        # holding an absolute path OUTSIDE the checkout. This artifact was
        # the one Gap-16-shaped input with no such override; it has one now
        # (`$CRABGIC_REQUIREMENT_TRACEABILITY_RECORD`), and this step is what
        # fills it.
        #
        # `$RUNNER_TEMP`, never `$GITHUB_WORKSPACE`: several harnesses assert
        # against the checked-out tree, and an untracked artifact inside it
        # would be a foreign object in the release candidate they attest to.
        #
        # This runs the REAL containerized binding — `docker compose up` of a
        # Grafana image, fronted by an in-process TLS terminator, driving a
        # real dashboard mutation through the real `executeMutationPlan`
        # pipeline and reading the applied revision back. GitHub's
        # ubuntu-latest runners ship a working Docker daemon, which is why
        # this can run here and not on an arbitrary developer host.
        #
        # NEVER FAILS THE JOB, deliberately, on the same principle as the
        # ARM64 ingest above: a binding that could not be produced is the
        # honest input "no confirmed remote revision for this candidate", and
        # the gate reports exactly that, with reasons. Masking it as an
        # infrastructure error would hide a real release finding.
        env:
          CRABGIC_RELEASE_CANDIDATE_OBJECT_ID: ${{ steps.release-candidate.outputs.object_id }}
          CRABGIC_REQUIREMENT_TRACEABILITY_RECORD: ${{ runner.temp }}/requirement-traceability.json
        run: |
          set -uo pipefail
          if npx vitest run --config e2e/attestation/vitest.live.config.ts; then
            echo "CRABGIC_REQUIREMENT_TRACEABILITY_RECORD=$CRABGIC_REQUIREMENT_TRACEABILITY_RECORD" >> "$GITHUB_ENV"
            echo "bound requirement-traceability at $CRABGIC_RELEASE_CANDIDATE_OBJECT_ID"
            cat "$CRABGIC_REQUIREMENT_TRACEABILITY_RECORD"
          else
            echo "::warning::containerized traceability binding did not complete -- requirement-traceability will report no confirmed remote revision"
          fi
      - name: Run every self-contained e2e harness's offline suite (excludes @live/CRABGIC_LIVE-gated tests)
        # THE ONE LEG WITH NETWORK. `e2e/release`'s reproducible-build check
        # verifies "two independent from-clean-checkout BUILDS produce
        # byte-identical tarball hashes" (roadmap/23-release-hardening.md
        # :136). Actually BUILDING the two checkouts needs `npm ci`, i.e.
        # the registry — which the ordinary developer/offline invocation
        # does not have, so the rebuilding populator is env-gated rather
        # than default-on (see `e2e/release/src/rebuildPopulator.ts`). This
        # job already runs `npm ci` itself several steps up, so it is the
        # one place the flag can honestly be set. Without it the gate does
        # NOT silently assume the clause: it emits a release-blocking reason
        # saying the rebuild leg did not run.
        # `e2e/release/src/releaseWorkflowWiring.test.ts` asserts this
        # wiring against the exported constant, so flag and workflow cannot
        # drift apart.
        env:
          CRABGIC_RELEASE_REBUILD_CHECKOUTS: "1"
          CRABGIC_RELEASE_CANDIDATE_OBJECT_ID: ${{ steps.release-candidate.outputs.object_id }}
        run: npm run test:e2e:release-evidence
      - name: Run the ReleaseGateReport generator
        env:
          CRABGIC_RELEASE_CANDIDATE_OBJECT_ID: ${{ steps.release-candidate.outputs.object_id }}
          CRABGIC_RELEASE_GATE_MODE: ${{ inputs.scoring_mode }}
        run: node e2e/report/dist/cli.js
      - name: Upload the archived release-gate-report.json (audit trail)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-report
          path: e2e/release-gate-report.json
          if-no-files-found: error
