name: release-e2e

# roadmap/23-release-hardening.md work item 1 / §Interfaces produced:
# "`e2e/release-gate-report.json` (introduced here; phase-23-internal) —
# the checklist-item -> EvidenceRecord audit trail, archived by the
# `release-e2e` CI job (introduced here)." Exit criteria: "`release-e2e` CI
# job's archived `e2e/release-gate-report.json` shows PASS for every item
# below, each linked to >=1 EvidenceRecord from the exact release-candidate
# object ID."
#
# HONESTY NOTE (mirrors `engine-live.yml`/`jira-datacenter-smoke.yml`'s own
# precedent, updated by this phase's integration/reconciliation pass): work
# items 2-10's six self-contained harnesses (`e2e/provisioning`,
# `e2e/matrix/{installation,git,orchestration,connector}`, `e2e/live`,
# `e2e/release`) now exist and this job runs their OFFLINE (non-`@live`/
# non-`EO_LIVE`-gated) suites via `npm run test:e2e` + typechecks them via
# `npm run check:e2e-types`, immediately before generating the report — but
# each harness's own `EvidenceRecord` journal is still a per-test-file
# ephemeral temp directory (created and torn down inside that harness's own
# test run; see e.g. `e2e/matrix/installation/src/test-support/test-journal
# .ts`), never a shared/persistent location this generator step can read.
# Wiring a real, shared, CI-visible journal that both a harness run and this
# generator step observe is explicit composition-root work, deliberately
# NOT done by this integration pass (approved-but-paused, separate step).
# Concretely: `npm run test:e2e` genuinely passing is real, verified
# evidence that every harness's own real checks are green on this
# checkout — but it does not, by itself, cause this step's
# `e2e/release-gate-report.json` run to see any new linked `EvidenceRecord`s
# (the generator only reads whatever `EO_RELEASE_GATE_JOURNAL_DIR` resolves
# to, which stays empty until that composition-root wiring lands). Every
# one of the 15 checklist items legitimately still scores EVIDENCE-PENDING
# in `interim` mode today — this step is real and already wired for the day
# a real, shared journal exists.
#
# Trigger stays manual (`workflow_dispatch`) and this job is NOT part of
# the required push/PR check set (unlike `ci.yml`/`gates-conformance.yml`/
# `perf-conformance.yml`, which run on every push) — mirrors `engine-live`'s
# own "live runs are started deliberately" rationale, and additionally:
# until work items 2-10 exist, a per-push run of this job could do nothing
# but reproduce the same EVIDENCE-PENDING report every time, so it would
# never be a meaningful blocking signal yet.

on:
  workflow_dispatch:
    inputs:
      release_candidate_object_id:
        description: "Exact release-candidate Git object ID (defaults to `git rev-parse HEAD` of the checked-out ref if omitted)"
        required: false
        type: string
      scoring_mode:
        description: "'interim' (missing evidence -> EVIDENCE-PENDING) or 'final' (missing evidence -> FAIL, the real release-cut mode)"
        required: false
        type: choice
        options:
          - interim
          - final
        default: interim

jobs:
  release-e2e:
    name: release-e2e (ReleaseGateReport generator)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Build (incl. e2e/report, wired into the root tsc -b project references)
        run: npm run build
      - name: Typecheck every self-contained e2e harness (each has its own tsconfig.json)
        run: npm run check:e2e-types
      - name: Run every self-contained e2e harness's offline suite (excludes @live/EO_LIVE-gated tests)
        run: npm run test:e2e
      - name: Run the ReleaseGateReport generator
        env:
          EO_RELEASE_CANDIDATE_OBJECT_ID: ${{ inputs.release_candidate_object_id }}
          EO_RELEASE_GATE_MODE: ${{ inputs.scoring_mode }}
        run: node e2e/report/dist/cli.js
      - name: Upload the archived release-gate-report.json (audit trail)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-report
          path: e2e/release-gate-report.json
          if-no-files-found: error
