version: "3.8"

# roadmap/23-release-hardening.md §In scope: Grafana OSS 12.4 recipe.
# Mirrors ../11.6/docker-compose.yml — see that file's header for the full
# rationale (owed by phase 20, mirrors docker/jira-datacenter's structure,
# genuinely license-free).
#
# Usage:
#   docker compose -f docker/grafana/12.4/docker-compose.yml up -d
#   ../smoke-test.sh 12.4 oss
#   docker compose -f docker/grafana/12.4/docker-compose.yml down -v   # teardown
services:
  grafana:
    image: grafana/grafana-oss:12.4.3
    ports:
      - "3002:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana-12_4-data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

volumes:
  grafana-12_4-data:
