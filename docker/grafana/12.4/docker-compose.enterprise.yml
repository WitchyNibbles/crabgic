version: "3.8"

# Enterprise counterpart of ./docker-compose.yml. See
# ../11.6/docker-compose.enterprise.yml's header for the full no-license-
# needed-to-boot rationale.
#
# Usage:
#   docker compose -f docker/grafana/12.4/docker-compose.enterprise.yml up -d
#   ../smoke-test.sh 12.4 enterprise
#   docker compose -f docker/grafana/12.4/docker-compose.enterprise.yml down -v   # teardown
services:
  grafana-enterprise:
    image: grafana/grafana-enterprise:12.4
    ports:
      - "3003:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana-12_4-enterprise-data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

volumes:
  grafana-12_4-enterprise-data:
